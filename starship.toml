# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

[line_break]
disabled = true

[character]
success_symbol = "[➜](bold #00FF7F) " 
error_symbol = "[➜](bold red) "

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

# 1. The core layout definition
format = "$username$hostname $directory$git_branch$git_status$character "

# 2. User (whaler)
[username]
show_always = true
format = "[$user]($style)"
style_user = "bold #00FF7F" # SpringGreen Hex

[hostname]
ssh_only = false
format = "[@$hostname]($style) "
style = "bold #00FF7F" # SpringGreen Hex

[directory]
format = "[$path]($style) "
style = "bold #fc8c30"
truncation_length = 0

[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
style = "bold purple"

# 6. FORCE DISABLE ALL CLOUD/VERSION NOISE
[aws]
disabled = true
[gcloud]
disabled = true
[nodejs]
disabled = true
[python]
disabled = true
[golang]
disabled = true
[rust]
disabled = true
[lua]
disabled = true
[terraform]
disabled = true

